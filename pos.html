<style>
/* ALKA MART POS - uses the storefront's tokens (colors, Inter, 10px radius, button styles). */
:root{--red:#E60012;--red-dark:#B8000E;--blue:#159BD7;--white:#fff;--bg:#F7F8FA;--ink:#252525;--gray:#6B7280;--line:#E5E7EB;--green:#218838;--amber:#B45309;--r:10px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;font-size:15px}
img{max-width:100%;display:block}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}h2{font-size:1.25rem;font-weight:700}h3{font-size:1rem;font-weight:600}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.muted{color:var(--gray)}.small{font-size:.85rem}.nowrap{white-space:nowrap}.right{text-align:right}.hidden{display:none!important}.mono{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1.5px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--red);color:#fff}.btn.primary:hover{background:var(--red-dark)}
.btn.outline{background:#fff;border-color:var(--line);color:var(--ink)}.btn.outline:hover{border-color:var(--blue);color:var(--blue)}
.btn.blue{background:var(--blue);color:#fff}.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}.btn.danger:hover{background:var(--red);color:#fff}
.btn.lg{min-height:54px;font-size:1.1rem}.btn.full{width:100%}.btn.sm{min-height:32px;padding:0 10px;font-size:.85rem}
.btn:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed;border-color:transparent}
.link-btn{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;padding:4px;text-decoration:underline}
kbd{font:600 .72rem/1 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;background:#fff;color:var(--gray)}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:3px solid var(--red);display:flex;align-items:center;gap:12px;padding:6px 14px}
.top .logo{height:48px;width:auto}
.top .app{font-weight:800;letter-spacing:-.01em;font-size:1.05rem;line-height:1.1}.top .app small{display:block;font-weight:500;color:var(--gray);font-size:.72rem}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 9px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--ink);white-space:nowrap}
.nav button:hover,.nav button.on{color:var(--red);border-bottom-color:var(--red)}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:#fff;cursor:pointer;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:#9ca3af;display:inline-block}
.chip.ok i{background:var(--green)}.chip.warn i{background:#f59e0b}.chip.bad i{background:var(--red)}.chip.info i{background:var(--blue)}

main{padding:14px 16px 40px;max-width:1700px;margin:0 auto}
main.fit{height:calc(100vh - 62px);display:flex;flex-direction:column;padding-bottom:12px}main.fit #pg{flex:1;min-height:0}main.fit .sale{height:100%}
.banner{border-radius:var(--r);padding:9px 14px;margin-bottom:12px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:#FFF7E6;border:1px solid #F5D08A}.banner.info{background:#EAF6FC;border:1px solid #BFE3F5}.banner.bad{background:#FDECEE;border:1px solid #F6B8BE}.banner.ok{background:#E8F5EC;border:1px solid #B5DDBF}

/* sale screen */
.sale{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:14px;min-height:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lcol{display:flex;flex-direction:column;min-height:0}
.scanrow{display:flex;gap:8px;margin-bottom:8px}
.scanrow input{flex:1;height:48px;font-size:1.1rem;padding:0 14px;border:2px solid var(--line);border-radius:var(--r);font:inherit;font-size:1.05rem}
.scanrow input:focus{border-color:var(--blue);outline:none}
.scanmsg{min-height:26px;font-size:.9rem;font-weight:600;margin:0 0 6px}.scanmsg.err{color:var(--red)}.scanmsg.ok{color:var(--green)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:thin}
.cats button{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.cats button.on,.cats button:hover{border-color:var(--red);color:var(--red)}.cats button.on{background:#FDECEE}
.grid{display:grid;grid-auto-rows:max-content;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px;overflow:auto;padding:2px;align-content:start;flex:1;min-height:0}
.pcard{display:flex;flex-direction:column;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:0;cursor:pointer;font:inherit;overflow:hidden}
.pcard:hover{border-color:var(--red)}.pcard:disabled{opacity:.5;cursor:not-allowed}.pcard:disabled:hover{border-color:var(--line)}
.pimg{height:78px;display:grid;place-items:center;background:var(--bg);font-size:1.9rem;position:relative;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:cover}
.pbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.brand{font-size:.72rem;color:var(--gray);font-weight:600}.pname{font-weight:600;font-size:.92rem;line-height:1.25}.psize{font-size:.8rem;color:var(--gray)}
.price{font-weight:800;color:var(--red);font-size:1rem}.was{color:var(--gray);font-weight:400;font-size:.8rem;margin-left:5px}
.promo-tag{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font-size:.68rem;font-weight:700;border-radius:5px;padding:2px 6px}
.stock{font-size:.76rem;font-weight:600}.stock.ok{color:var(--green)}.stock.low{color:var(--amber)}.stock.out{color:var(--red)}
.code{font-size:.7rem;color:var(--gray);font-family:ui-monospace,Consolas,monospace}

.rcol{display:flex;flex-direction:column;min-height:0;padding:0}
.rcol>h2{padding:12px 14px 0;margin:0;display:flex;justify-content:space-between;align-items:center}
.cart{flex:1;overflow:auto;padding:6px 14px;min-height:80px}
.empty{color:var(--gray);text-align:center;padding:30px 10px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.line .n{font-weight:600;line-height:1.25}.line .s{font-size:.8rem;color:var(--gray)}.line .t{font-weight:700;text-align:right}
.qty{display:flex;align-items:center;gap:4px;margin-top:4px}
.qty button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:1.1rem;font-weight:700;cursor:pointer}.qty button:hover{border-color:var(--blue)}
.qty input{width:52px;height:32px;text-align:center;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-weight:600}
.checkout{border-top:1px solid var(--line);padding:8px 14px 12px;background:#fff;border-radius:0 0 var(--r) var(--r)}
.srow{display:flex;justify-content:space-between;align-items:center;margin:3px 0}.srow.total{font-size:1.4rem;font-weight:800;margin:4px 0}.srow.total strong{color:var(--red)}
.discount{display:flex;gap:6px;align-items:center}.discount input{width:92px}.discount select{height:34px}
input,select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;height:38px;background:#fff;color:var(--ink)}textarea{height:auto;padding:8px 10px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none}
.pays{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}
.pays button{min-height:38px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-weight:600;font-size:.78rem;cursor:pointer;padding:0 2px}
.pays button.on{border-color:var(--red);background:#FDECEE;color:var(--red-dark)}
.cashbox{background:var(--bg);border-radius:var(--r);padding:6px 10px;margin:6px 0}.cashbox input{width:150px;text-align:right;font-size:1.1rem;font-weight:700;height:42px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.quick button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}.quick button:hover{border-color:var(--blue)}
.change{font-size:1.15rem;font-weight:800;color:var(--green)}.change.neg{color:var(--red)}

/* tables / pages */
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.page-h h2{margin:0;flex:1}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}.toolbar label{display:flex;flex-direction:column;font-size:.78rem;font-weight:600;color:var(--gray);gap:3px}
.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#FAFAFB;font-weight:700;position:sticky;top:0;z-index:1;font-size:.8rem;color:var(--gray)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:#FBFBFC}tr.void td{color:var(--gray)}tr.void td.keep{color:var(--ink)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.74rem;font-weight:700;background:#eee;color:#444}
.tag.completed,.tag.ok{background:#E8F5EC;color:var(--green)}.tag.voided,.tag.refunded,.tag.bad{background:#FDECEE;color:var(--red-dark)}.tag.low{background:#FFF1D6;color:var(--amber)}.tag.online{background:#EAF6FC;color:#0E6C97}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}.stat span{display:block;font-size:.78rem;color:var(--gray);font-weight:600}.stat strong{font-size:1.3rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;margin-top:12px}
.bar{height:8px;background:var(--red);border-radius:4px;min-width:2px}.bar.b{background:var(--blue)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}.formgrid .wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:3px;font-size:.82rem;font-weight:600;color:var(--gray)}.field input,.field select,.field textarea{width:100%;color:var(--ink);font-weight:400}
.err{color:var(--red);font-size:.85rem;font-weight:600}
.diff{font-size:.78rem;color:var(--gray)}.diff b{color:var(--ink)}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(20,20,25,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:20px;position:relative}.modal.wide{max-width:980px}.modal.rc{max-width:460px}
.modal .x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:1.3rem;cursor:pointer}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 18px;z-index:200;font-weight:600}
.done{text-align:center}.done .big{font-size:2.2rem;font-weight:800;color:var(--green)}
iframe.rcp{width:100%;height:420px;border:1px solid var(--line);border-radius:8px;background:#fff}
.danger-zone{border:1.5px solid var(--red);border-radius:var(--r);padding:14px;margin-top:14px;background:#FFF8F8}
@media (max-width:1100px){main.fit{height:auto}.sale{grid-template-columns:1fr;height:auto!important}.grid{max-height:50vh}}
@media (max-width:700px){.formgrid{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.top{flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translate(-50%,8px)}}}
.qty .link-btn{width:auto;height:auto;border:0;background:none;font-size:.85rem;margin-left:6px}

</style>

<script>
/* ALKA MART POS - IndexedDB layer, settings, shared helpers.
   Classic script (no ES modules) so pos.html also works when opened from file://. */
(function () {
  'use strict';
  const POS = (window.POS = window.POS || {});
  const DB_NAME = 'AlkaMartPOS', DB_VER = 1;

  const SCHEMA = {
    products:     { keyPath: 'id', indexes: [['barcode', 'barcode'], ['sku', 'sku'], ['category', 'category']] },
    sales:        { keyPath: 'id', indexes: [['createdAt', 'createdAt'], ['status', 'status'], ['syncStatus', 'syncStatus'], ['idemKey', 'idemKey', { unique: true }]] },
    movements:    { keyPath: 'id', indexes: [['productId', 'productId'], ['createdAt', 'createdAt'], ['syncStatus', 'syncStatus']] },
    audit:        { keyPath: 'id', indexes: [['createdAt', 'createdAt']] },
    onlineOrders: { keyPath: 'number' },
    meta:         { keyPath: 'key' }
  };
  const STORE_NAMES = Object.keys(SCHEMA);

  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB is not available in this browser.'));
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const [n, s] of Object.entries(SCHEMA)) {
          if (d.objectStoreNames.contains(n)) continue;
          const st = d.createObjectStore(n, { keyPath: s.keyPath });
          (s.indexes || []).forEach(([a, b, o]) => st.createIndex(a, b, o || {}));
        }
      };
      r.onsuccess = () => { r.result.onversionchange = () => r.result.close(); res(r.result); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('The database is blocked by another ALKA MART POS tab. Close the other tab and reload.'));
    });
    return dbp;
  }

  const P = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const wrap = (s) => ({
    get: (k) => P(s.get(k)), put: (v) => P(s.put(v)), add: (v) => P(s.add(v)), del: (k) => P(s.delete(k)),
    all: () => P(s.getAll()), clear: () => P(s.clear()), count: () => P(s.count()),
    byIndex: (i, k) => P(s.index(i).getAll(k)), firstByIndex: (i, k) => P(s.index(i).get(k))
  });

  /* Run fn inside ONE IndexedDB transaction. If fn throws, the whole transaction is aborted
     (nothing is written) and the error is re-thrown. Only await IndexedDB promises inside fn. */
  async function run(stores, mode, fn) {
    const d = await open();
    const names = Array.isArray(stores) ? stores : [stores];
    return new Promise((res, rej) => {
      const t = d.transaction(names, mode);
      const S = {}; names.forEach((n) => (S[n] = wrap(t.objectStore(n))));
      let out, failure = null;
      t.oncomplete = () => res(out);
      t.onerror = () => { if (!failure) failure = t.error; };
      t.onabort = () => rej(failure || t.error || new Error('Transaction aborted'));
      Promise.resolve().then(() => fn(S, t)).then((v) => { out = v; }, (e) => { failure = e; try { t.abort(); } catch (_) { /* already finished */ } });
    });
  }

  const db = {
    open, run,
    getAll: (s) => run(s, 'readonly', (S) => S[s].all()),
    get: (s, k) => run(s, 'readonly', (S) => S[s].get(k)),
    put: (s, v) => run(s, 'readwrite', (S) => S[s].put(v)),
    del: (s, k) => run(s, 'readwrite', (S) => S[s].del(k)),
    async metaGet(key, def) { const r = await run('meta', 'readonly', (S) => S.meta.get(key)); return r ? r.value : def; },
    metaSet: (key, value) => run('meta', 'readwrite', (S) => S.meta.put({ key, value })),
    async exportAll() { const o = {}; for (const n of STORE_NAMES) o[n] = await db.getAll(n); return o; },
    async importAll(data) {
      return run(STORE_NAMES, 'readwrite', async (S) => {
        for (const n of STORE_NAMES) { await S[n].clear(); for (const row of data[n] || []) await S[n].put(row); }
      });
    },
    async clearAll() { return run(STORE_NAMES, 'readwrite', async (S) => { for (const n of STORE_NAMES) await S[n].clear(); }); },
    STORE_NAMES
  };
  POS.db = db;

  /* ---------- helpers ---------- */
  POS.uid = function () {
    if (window.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (_) { /* insecure context */ } }
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  };
  POS.nowIso = () => new Date().toISOString();
  POS.rp = (n) => (n < 0 ? '-' : '') + 'Rp' + String(Math.abs(Math.round(Number(n) || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  POS.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  POS.ymd = (d) => { d = d || new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); };
  POS.fmtDate = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }); };
  POS.PosError = class PosError extends Error { constructor(code, message, detail) { super(message); this.code = code; this.detail = detail; } };

  POS.download = function (filename, text, mime) {
    const bom = /csv/.test(mime || '') ? '\uFEFF' : '';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bom + text], { type: mime || 'text/plain' }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  /* ---------- settings (kept in memory, persisted in meta store) ---------- */

<script>
/* ALKA MART POS - catalog, pricing (mirrors the website), stock operations, website bridge. */
(function () {

    calc(cost, m) {
      cost = Number(cost); m = Number(m);
      if (!Number.isInteger(cost) || cost <= 0) throw Error('Supplier price must be a positive whole number of rupiah.');
      if (!Number.isFinite(m) || m < 5 || m > 10) throw Error('Markup must be between 5% and 10%.');

    markup: (p) => (p.markupPercent == null || p.markupPercent === '' ? POS.settings.defaultMarkup : Number(p.markupPercent)),
    retail(p) { try { return pricing.calc(p.supplierPrice, pricing.markup(p)); } catch (_) { return null; } },
    promoOn(p, now) {
      const o = p.promo; if (!o || !o.enabled || !Number.isInteger(o.price) || o.price <= 0) return false;

  /* Bring any website-shaped product to the POS shape (website fields kept, POS extras added). */

    const pr = p.promo || {};
    const o = {
      id: String(p.id), name: str(p.name), brand: str(p.brand), category: str(p.category), size: str(p.size), description: str(p.description),
      supplier: str(p.supplier) || 'Lotte Grosir', supplierPrice: Number(p.supplierPrice),
      priceType: p.priceType === 'verified' ? 'verified' : 'estimated',
      markupPercent: p.markupPercent === '' || p.markupPercent == null ? null : Number(p.markupPercent),
      sellingPrice: null, image: p.image || '', sourceUrl: p.sourceUrl || null,
      inStock: q > 0, stockQuantity: q, visible: p.visible !== false, featured: !!p.featured, isBestSeller: !!p.isBestSeller,
      storage: p.storage === 'frozen' ? 'frozen' : 'ambient',
      promo: { enabled: !!pr.enabled, price: Number.isInteger(pr.price) ? pr.price : null, start: pr.start || '', end: pr.end || '' },
      barcode: str(p.barcode), sku: str(p.sku),
      minStock: p.minStock === '' || p.minStock == null || !Number.isFinite(Number(p.minStock)) ? null : Math.max(0, Math.floor(Number(p.minStock))),
      rev: p.rev || 1, syncedRev: p.syncedRev || 0, updatedAt: p.updatedAt || POS.nowIso()

  POS.validateProduct = function (p, all, isNew) {

    const code = (v) => str(v).toLowerCase();
    for (const o of all) {
      if (o.id === p.id) continue;
      if (p.barcode && code(o.barcode) === code(p.barcode)) e.push('Barcode already used by "' + o.name + '" (' + o.id + ').');

    list: () => db.getAll('products'),

    findByCode(list, code) {

    async stockOp(o) {

  };
})();

/* ALKA MART POS - CSV import (with preview + validation) and CSV exports. Excel-friendly (UTF-8 BOM, , or ; delimiter). */
(function () {
  'use strict';

  function parse(text) {
    text = String(text).replace(/^\uFEFF/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const delim = [',', ';', '\t'].map((c) => [c, first.split(c).length - 1]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some((x) => x.trim() !== '')) rows.push(row); row = []; }
      else cur += c;

  const A = {
    id: ['id', 'productid', 'product id'], name: ['name', 'productname', 'nama'], brand: ['brand', 'merek'], category: ['category', 'kategori'], size: ['size', 'packagesize', 'ukuran'],
    supplier: ['supplier'], supplierPrice: ['supplierprice', 'suppliercost', 'cost', 'hargasupplier'], priceType: ['pricetype'], markupPercent: ['markuppercent', 'markup'],
    sellingPrice: ['sellingprice', 'price', 'hargajual'], stockQuantity: ['stockquantity', 'stock', 'qty', 'stok'], minStock: ['minstock', 'minimumstock', 'minimumstocklevel'],
    barcode: ['barcode', 'ean', 'upc'], sku: ['sku'], storage: ['storage'], visible: ['visible'], featured: ['featured'], isBestSeller: ['isbestseller', 'bestseller'],

    'storage', 'visible', 'featured', 'isBestSeller', 'promoEnabled', 'promoPrice', 'promoStart', 'promoEnd', 'description'];

      set('barcode', r.barcode); set('sku', r.sku); if (has('minStock')) base.minStock = ms;
      if (has('storage') && r.storage) base.storage = /frozen/i.test(r.storage) ? 'frozen' : 'ambient';
      ['visible', 'featured', 'isBestSeller'].forEach((f) => { if (has(f) && r[f] !== '') base[f] = bool(r[f]); });
      set('description', r.description);
      if (has('promoEnabled') || has('promoPrice') || has('promoStart') || has('promoEnd')) {
        base.promo = Object.assign({}, base.promo, has('promoEnabled') ? { enabled: bool(r.promoEnabled) } : {}, has('promoPrice') ? { price: pp } : {}, has('promoStart') ? { start: r.promoStart } : {}, has('promoEnd') ? { end: r.promoEnd } : {});
      }
      if (!cur) { base.stockQuantity = st == null ? 0 : st; }
      const cand = POS.normalizeProduct(Object.assign({}, base, cur ? { stockQuantity: cur.stockQuantity, rev: cur.rev, syncedRev: cur.syncedRev } : {}));
      if (!cur && !cand.id) cand.id = '(auto)';
      e.errors.push(...POS.validateProduct(Object.assign({}, cand, { id: cand.id === '(auto)' ? '__new__' : cand.id }), all.filter((p) => !cur || p.id !== cur.id)));
      const retail = POS.pricing.retail(cand);
      const sell = num(r.sellingPrice);
      if (sell != null && !Number.isNaN(sell) && retail != null && sell !== retail) e.warnings.push('Selling price in file (' + POS.rp(sell) + ') is ignored: the POS uses the website rule supplier cost x markup = ' + POS.rp(retail) + '.');
      if (cur) {
        for (const f of COMPARE) { const a = JSON.stringify(cur[f]), b = JSON.stringify(cand[f]); if (a !== b) e.changes.push({ field: f, from: show(f, cur[f]), to: show(f, cand[f]) }); }
        if (st != null && !Number.isNaN(st) && st !== POS.stockOf(cur)) e.stockChange = { from: POS.stockOf(cur), to: st };
        e.baseRev = cur.rev || 1;
      }
      e.product = cand;
      e.action = e.errors.length ? 'error' : !cur ? 'new' : e.changes.length || e.stockChange ? 'update' : 'same';
      out.push(e);
    }
    return out;
  }

  /* Apply the selected, valid preview rows in one transaction. */
  async function apply(entries, opts) {
    opts = opts || {};
    const sum = { created: 0, updated: 0, stockAdjusted: 0, skipped: 0, errors: [] };
    await db.run(['products', 'movements', 'audit'], 'readwrite', async (S) => {
      const all = await S.products.all();
      let next = Math.max(0, ...all.map((x) => +(/^alka-(\d+)$/.exec(x.id) || [0, 0])[1]));
      for (const e of entries) {
        if (e.action === 'error' || e.action === 'same' || e.selected === false) { sum.skipped++; continue; }
        if (e.action === 'new') {
          const p = Object.assign({}, e.product, { rev: 1, syncedRev: 0, updatedAt: POS.nowIso() });
          if (!p.id || p.id === '(auto)') { do { next++; p.id = 'alka-' + String(next).padStart(3, '0'); } while (all.some((x) => x.id === p.id)); }
          if (await S.products.get(p.id)) { sum.errors.push('Line ' + e.line + ': id ' + p.id + ' now exists.'); sum.skipped++; continue; }
          all.push(p); await S.products.put(p); sum.created++;
          if (p.stockQuantity > 0) await S.movements.put({ id: POS.uid(), createdAt: POS.nowIso(), productId: p.id, productName: p.name, size: p.size, type: 'initial', qtyChange: p.stockQuantity, resultingStock: p.stockQuantity, reason: 'Opening stock (import)', refId: '', cashier: POS.settings.cashier, source: 'POS', syncStatus: 'pending' });
        } else {
          const cur = await S.products.get(e.existing.id);
          if (!cur || (cur.rev || 1) !== e.baseRev) { sum.errors.push('Line ' + e.line + ': "' + e.existing.name + '" changed after the preview was built. Re-run the import.'); sum.skipped++; continue; }
          const p = Object.assign({}, e.product, { stockQuantity: cur.stockQuantity, inStock: cur.inStock, rev: (cur.rev || 1) + 1, syncedRev: cur.syncedRev || 0, updatedAt: POS.nowIso() });
          p.sellingPrice = POS.pricing.retail(p);
          if (e.changes.length) { await S.products.put(p); sum.updated++; }
          if (opts.applyStock && e.stockChange) {
            const live = await S.products.get(p.id);
            await POS.applyStock(S, live, e.stockChange.to - POS.stockOf(live), { type: 'adjustment', reason: 'Import stock correction (was ' + e.stockChange.from + ')' });
            sum.stockAdjusted++; if (!e.changes.length) sum.updated++;
          }
        }
      }
      await S.audit.put(POS.audit('import', JSON.stringify({ created: sum.created, updated: sum.updated, stockAdjusted: sum.stockAdjusted, skipped: sum.skipped })));
    });
    return sum;
  }

  /* ---------- exports ---------- */
  const iso = (s) => s || '';
  async function exportRows(kind) {
    if (kind === 'products') {
      const list = await POS.products.list();
      return { headers: PRODUCT_HEADERS.concat(['unitPriceNow', 'rev']), rows: list.map((p) => Object.assign(websiteToRow(p), { sellingPrice: POS.pricing.retail(p), unitPriceNow: POS.pricing.unit(p), rev: p.rev })) };
    }
    const sales = (await db.getAll('sales')).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    if (kind === 'sales') return { headers: ['receiptNo', 'type', 'createdAt', 'status', 'cashier', 'itemCount', 'units', 'subtotal', 'discount', 'total', 'cogs', 'grossProfit', 'paymentMethod', 'cashReceived', 'change', 'paymentRef', 'reversalType', 'reversalReason', 'reversedAt', 'uid'],
      rows: sales.map((s) => ({ receiptNo: s.id, type: s.type, createdAt: s.createdAt, status: s.status, cashier: s.cashier, itemCount: s.items.length, units: s.items.reduce((n, i) => n + i.qty, 0), subtotal: s.subtotal, discount: s.discount, total: s.total, cogs: s.cogs, grossProfit: s.total - s.cogs,
        paymentMethod: s.payment.method, cashReceived: s.payment.received, change: s.payment.change, paymentRef: s.payment.reference || '', reversalType: s.reversal ? s.reversal.type : '', reversalReason: s.reversal ? s.reversal.reason : '', reversedAt: s.reversal ? s.reversal.at : '', uid: s.uid })) };
    if (kind === 'items') { const rows = []; sales.forEach((s) => s.items.forEach((i) => rows.push({ receiptNo: s.id, type: s.type, createdAt: s.createdAt, status: s.status, productId: i.productId, name: i.name, brand: i.brand, size: i.size, category: i.category, qty: i.qty, regularPrice: i.regularPrice, unitPrice: i.unitPrice, promoApplied: i.promoApplied ? 'yes' : 'no', unitCost: i.unitCost, lineTotal: i.lineTotal, lineCost: i.lineCost, lineGrossProfit: i.lineTotal - i.lineCost })));
      return { headers: ['receiptNo', 'type', 'createdAt', 'status', 'productId', 'name', 'brand', 'size', 'category', 'qty', 'regularPrice', 'unitPrice', 'promoApplied', 'unitCost', 'lineTotal', 'lineCost', 'lineGrossProfit'], rows }; }
    if (kind === 'movements') { const m = (await db.getAll('movements')).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
      return { headers: ['createdAt', 'productId', 'productName', 'size', 'type', 'qtyChange', 'resultingStock', 'reason', 'refId', 'cashier', 'source'], rows: m }; }
    throw Error('Unknown export');
  }
  async function exportCsv(kind) {
    const { headers, rows } = await exportRows(kind);
    const names = { products: 'inventory', sales: 'pos-transactions', items: 'pos-transaction-items', movements: 'stock-movements' };
    POS.download('alka-' + names[kind] + '-' + POS.ymd() + '.csv', serialize(headers, rows), 'text/csv;charset=utf-8');
    return rows.length;
  }

  POS.csv = { parse, serialize, rowsToObjects, websiteToRow, preview, apply, exportRows, exportCsv, PRODUCT_HEADERS };
})();

<script>
/* ALKA MART POS - checkout, void/refund, transaction queries, receipts & printing. */
(function () {
  'use strict';
  const POS = window.POS, db = POS.db, PosError = POS.PosError, rp = POS.rp, esc = POS.esc;

  POS.PAYMENTS = [['cash', 'Cash'], ['qris', 'QRIS'], ['card', 'Debit / credit card'], ['transfer', 'Bank transfer'], ['other', 'Other']];
  POS.payLabel = (k) => (POS.PAYMENTS.find((x) => x[0] === k) || [0, k])[1];

  function computeDiscount(subtotal, d) {
    d = d || { type: 'amount', value: 0 };
    const v = Number(d.value) || 0;
    if (v < 0) throw new PosError('INVALID', 'Discount cannot be negative.');
    let amt = d.type === 'percent' ? Math.round(subtotal * v / 100) : Math.round(v);
    if (d.type === 'percent' && v > 100) throw new PosError('INVALID', 'Percent discount cannot exceed 100%.');
    if (amt > subtotal) throw new PosError('INVALID', 'Discount (' + rp(amt) + ') is larger than the subtotal (' + rp(subtotal) + ').');
    return amt;
  }

  /* One atomic transaction: validate stock -> write sale -> deduct stock -> write movements.
     If anything fails nothing is saved. idemKey (one per sale attempt) makes double-submits harmless. */
  async function checkout(o) {
    const idemKey = o.idemKey; if (!idemKey) throw new PosError('INVALID', 'Missing checkout key.');
    const merged = new Map();
    for (const l of o.cart || []) merged.set(l.productId, (merged.get(l.productId) || 0) + Math.floor(Number(l.qty) || 0));
    if (!merged.size) throw new PosError('EMPTY', 'The sale is empty.');
    const method = (o.payment || {}).method;
    if (!POS.PAYMENTS.some((x) => x[0] === method)) throw new PosError('INVALID', 'Choose a payment method.');

    return db.run(['products', 'sales', 'movements', 'meta', 'audit'], 'readwrite', async (S) => {
      const dup = await S.sales.firstByIndex('idemKey', idemKey);
      if (dup) return { duplicate: true, sale: dup };

      const items = []; const prods = [];
      for (const [id, qty] of merged) {
        if (!(qty >= 1)) throw new PosError('INVALID', 'Quantity must be at least 1.');
        const p = await S.products.get(id);
        if (!p) throw new PosError('NOT_FOUND', 'Product ' + id + ' no longer exists.');
        const unit = POS.pricing.unit(p), reg = POS.pricing.retail(p);
        if (unit === null) throw new PosError('NO_PRICE', '"' + p.name + '" has no valid price. Fix its supplier cost first.');
        if (POS.stockOf(p) < qty) throw new PosError('NEGATIVE_STOCK', 'Not enough stock for "' + p.name + ' ' + p.size + '": ' + POS.stockOf(p) + ' available, ' + qty + ' requested.', { productId: id, have: POS.stockOf(p) });
        items.push({ productId: p.id, name: p.name, brand: p.brand, size: p.size, category: p.category, qty, regularPrice: reg, unitPrice: unit, promoApplied: unit < reg,
          unitCost: Number(p.supplierPrice), lineTotal: unit * qty, lineCost: Number(p.supplierPrice) * qty });
        prods.push(p);
      }
      const subtotal = items.reduce((n, i) => n + i.lineTotal, 0), cogs = items.reduce((n, i) => n + i.lineCost, 0);
      const discount = computeDiscount(subtotal, o.discount), total = subtotal - discount;
      const pay = o.payment; let received = total, change = 0;
      if (method === 'cash') {
        received = Math.round(Number(pay.received));
        if (!Number.isFinite(received) || received < total) throw new PosError('INSUFFICIENT_CASH', 'Cash received (' + rp(received || 0) + ') is less than the total (' + rp(total) + ').');
        change = received - total;
      }
      /* receipt number: POS-YYYYMMDD-0001 (per day counter, stored with the sale in the same transaction) */
      const ymd = POS.ymd(), ck = 'counter:' + ymd;
      const c = ((await S.meta.get(ck)) || { value: 0 }).value + 1;
      await S.meta.put({ key: ck, value: c });
      const id = 'POS-' + ymd + '-' + String(c).padStart(4, '0');

      for (const it of items) { const p = prods.find((x) => x.id === it.productId); await POS.applyStock(S, p, -it.qty, { type: 'sale', reason: 'POS sale', refId: id, cashier: o.cashier }); }
      const sale = { id, uid: POS.deviceId + ':' + id, idemKey, type: 'POS', status: 'completed', createdAt: POS.nowIso(), cashier: o.cashier || POS.settings.cashier, note: o.note || '',
        items, subtotal, discount, discountSpec: o.discount || null, total, cogs, payment: { method, received, change, reference: (pay.reference || '').trim() }, reversal: null, syncStatus: 'pending', syncTries: 0, syncError: '' };
      await S.sales.add(sale);
      await S.audit.put(POS.audit('sale', id + ' ' + rp(total) + ' ' + method, o.cashier));
      return { duplicate: false, sale };
    });
  }

  /* Void / refund never deletes: the sale stays, gets status + reversal details, stock is returned via movements. */
  async function reverse(o) {
    if (!['void', 'refund'].includes(o.kind)) throw new PosError('INVALID', 'Unknown action.');
    if (!(o.reason || '').trim()) throw new PosError('INVALID', 'A reason is required.');
    return db.run(['products', 'sales', 'movements', 'audit'], 'readwrite', async (S) => {
      const s = await S.sales.get(o.saleId);
      if (!s) throw new PosError('NOT_FOUND', 'Transaction not found.');
      if (s.status !== 'completed') throw new PosError('INVALID', 'This transaction is already ' + s.status + '.');
      const restocked = [];
      if (o.restock) for (const it of s.items) {
        const p = await S.products.get(it.productId);
        if (!p) continue; /* product deleted since: nothing to restock into */
        await POS.applyStock(S, p, it.qty, { type: o.kind === 'void' ? 'void_return' : 'refund_return', reason: o.kind + ' ' + s.id + ': ' + o.reason, refId: s.id, cashier: o.cashier });
        restocked.push(it.productId);
      }
      s.status = o.kind === 'void' ? 'voided' : 'refunded';
      s.reversal = { type: o.kind, reason: o.reason.trim(), at: POS.nowIso(), by: o.cashier || POS.settings.cashier, restocked: !!o.restock, refundMethod: o.refundMethod || s.payment.method, amount: s.total };
      s.syncStatus = 'pending'; s.syncError = '';
      await S.sales.put(s);
      await S.audit.put(POS.audit('sale_' + o.kind, s.id + ' ' + rp(s.total) + ' | ' + o.reason + (o.restock ? ' | restocked' : ' | NOT restocked'), o.cashier));
      return s;
    });
  }

  function filter(sales, f) {
    f = f || {}; const q = (f.q || '').trim().toLowerCase();
    const from = f.from ? new Date(f.from + 'T00:00:00').getTime() : -Infinity, to = f.to ? new Date(f.to + 'T23:59:59.999').getTime() : Infinity;
    return sales.filter((s) => {
      const t = new Date(s.createdAt).getTime();
      if (t < from || t > to) return false;
      if (f.status && s.status !== f.status) return false;
      if (f.method && s.payment.method !== f.method) return false;
      if (q && !(s.id + ' ' + s.cashier + ' ' + s.items.map((i) => i.name + ' ' + i.brand).join(' ')).toLowerCase().includes(q)) return false;
      return true;
    }).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  }

  POS.tx = { checkout, reverse, filter, computeDiscount, list: () => db.getAll('sales'), get: (id) => db.get('sales', id) };

  /* ---------- receipts ---------- */
  function receiptHtml(sale, opts) {
    opts = opts || {}; const st = POS.settings, w = opts.width || st.paperWidth || '80';
    const a4 = w === 'a4', mm = a4 ? 100 : Number(w), fs = a4 ? 13 : mm <= 58 ? 10.5 : 12;
    const d = new Date(sale.createdAt);
    const line = (l, r, b) => '<div class="l' + (b ? ' b' : '') + '"><span>' + l + '</span><span>' + r + '</span></div>';
    const items = sale.items.map((i) => '<div class="it"><div>' + esc(i.name) + (i.brand ? ' - ' + esc(i.brand) : '') + ' ' + esc(i.size) + '</div>' +
      line(i.qty + ' x ' + rp(i.unitPrice) + (i.promoApplied ? ' (promo)' : ''), rp(i.lineTotal)) + '</div>').join('');
    const stamp = sale.status !== 'completed' ? '<div class="stamp">' + sale.status.toUpperCase() + '</div>' : '';
    const pay = sale.payment;
    return '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(sale.id) + '</title><style>' +
      '@page{size:' + (a4 ? 'A4' : mm + 'mm auto') + ';margin:' + (a4 ? '15mm' : '0') + '}' +
      '*{box-sizing:border-box}body{margin:0;font-family:"Courier New",ui-monospace,monospace;font-size:' + fs + 'px;line-height:1.35;color:#000;background:#fff}' +
      '.r{width:' + (a4 ? '100mm;margin:0 auto' : mm + 'mm') + ';padding:' + (a4 ? '0' : '3mm 3.5mm 6mm') + '}.c{text-align:center}.logo{width:' + (mm <= 58 ? 34 : 44) + 'mm;max-width:80%;margin:0 auto 2mm;display:block}' +
      '.sn{font-weight:700;font-size:' + (fs + 3) + 'px}.sm{font-size:' + (fs - 1.5) + 'px}hr{border:0;border-top:1px dashed #000;margin:2mm 0}.l{display:flex;justify-content:space-between;gap:6px}.l span:last-child{white-space:nowrap}' +
      '.b{font-weight:700}.it{margin-bottom:1.2mm}.big{font-size:' + (fs + 2) + 'px}.stamp{border:2px solid #000;text-align:center;font-weight:700;font-size:' + (fs + 4) + 'px;padding:1mm;margin:2mm 0;letter-spacing:2px}.rep{text-align:center;font-size:' + (fs - 2) + 'px}' +
      '</style></head><body><div class="r">' +
      (st.receiptLogo && window.POS_ASSETS ? '<img class="logo" src="' + POS_ASSETS.receiptLogo + '" alt="ALKA MART">' : '') +
      '<div class="c sn">' + esc(st.storeName) + '</div>' + (st.storeTagline ? '<div class="c sm">' + esc(st.storeTagline) + '</div>' : '') +
      (st.address ? '<div class="c sm">' + esc(st.address) + '</div>' : '') + (st.phone ? '<div class="c sm">Tel: ' + esc(st.phone) + '</div>' : '') + '<hr>' +
      line('Receipt', esc(sale.id)) + line('Date', d.toLocaleDateString('id-ID') + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })) + line('Cashier', esc(sale.cashier)) + '<hr>' +
      items + '<hr>' + line('Subtotal', rp(sale.subtotal)) + (sale.discount ? line('Discount', '-' + rp(sale.discount)) : '') + line('TOTAL', rp(sale.total), true).replace('class="l b"', 'class="l b big"') + '<hr>' +
      line('Payment', esc(POS.payLabel(pay.method))) + (pay.method === 'cash' ? line('Cash received', rp(pay.received)) + line('Change', rp(pay.change)) : '') +
      (pay.reference ? line('Ref', esc(pay.reference)) : '') + stamp + '<hr><div class="c">' + esc(st.receiptFooter) + '</div>' +
      (opts.reprint ? '<div class="rep">*** REPRINT ***</div>' : '') + '</div></body></html>';
  }

  function printHtml(html) {
    return new Promise((resolve) => {
      const f = document.createElement('iframe');
      f.setAttribute('aria-hidden', 'true'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
      document.body.appendChild(f);
      const w = f.contentWindow, d = w.document; d.open(); d.write(html); d.close();
      setTimeout(() => { try { w.focus(); w.print(); } catch (_) { /* printing blocked */ } setTimeout(() => { f.remove(); resolve(); }, 1500); }, 250);
    });
  }
  POS.receipt = { html: receiptHtml, print: (sale, opts) => printHtml(receiptHtml(sale, opts)) };
})();

<script>
/* ALKA MART POS - reports. Pure functions over stored data.
   "Gross profit" = actual sale total (after discount) - recorded product cost (COGS). It is NOT net profit. */
(function () {
  'use strict';
  const POS = window.POS;
  const z = (n) => String(n).padStart(2, '0');
  const dayKey = (iso) => { const d = new Date(iso); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
  const monthKey = (iso) => dayKey(iso).slice(0, 7);
  const weekKey = (iso) => { const d = new Date(iso); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };

  function range(kind, custom) {
    const n = new Date(), t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    const f = (d) => d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
    if (kind === 'today') return { from: f(t0), to: f(t0), group: 'day' };
    if (kind === 'week') { const m = new Date(t0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return { from: f(m), to: f(t0), group: 'day' }; }
    if (kind === 'month') return { from: f(new Date(n.getFullYear(), n.getMonth(), 1)), to: f(t0), group: 'day' };
    if (kind === 'last30') { const s = new Date(t0); s.setDate(s.getDate() - 29); return { from: f(s), to: f(t0), group: 'day' }; }
    if (kind === 'year') return { from: f(new Date(n.getFullYear(), 0, 1)), to: f(t0), group: 'month' };
    return Object.assign({ group: 'day' }, custom);
  }

  function salesReport(sales, r) {
    const from = r.from ? new Date(r.from + 'T00:00:00').getTime() : -Infinity, to = r.to ? new Date(r.to + 'T23:59:59.999').getTime() : Infinity;
    const inR = sales.filter((s) => { const t = new Date(s.createdAt).getTime(); return t >= from && t <= to; });
    const done = inR.filter((s) => s.status === 'completed');
    const key = r.group === 'month' ? monthKey : r.group === 'week' ? weekKey : dayKey;
    const T = { count: done.length, units: 0, subtotal: 0, discount: 0, revenue: 0, cogs: 0 };
    const per = new Map(), pay = new Map(), prod = new Map();
    for (const s of done) {
      const u = s.items.reduce((n, i) => n + i.qty, 0);
      T.units += u; T.subtotal += s.subtotal; T.discount += s.discount; T.revenue += s.total; T.cogs += s.cogs;
      const k = key(s.createdAt), row = per.get(k) || { key: k, count: 0, units: 0, revenue: 0, cogs: 0, discount: 0 };
      row.count++; row.units += u; row.revenue += s.total; row.cogs += s.cogs; row.discount += s.discount; per.set(k, row);
      const m = s.payment.method, pr = pay.get(m) || { method: m, count: 0, revenue: 0 }; pr.count++; pr.revenue += s.total; pay.set(m, pr);
      for (const i of s.items) { const b = prod.get(i.productId) || { productId: i.productId, name: i.name, brand: i.brand, size: i.size, units: 0, revenue: 0, cost: 0 }; b.units += i.qty; b.revenue += i.lineTotal; b.cost += i.lineCost; prod.set(i.productId, b); }
    }
    T.grossProfit = T.revenue - T.cogs; T.margin = T.revenue ? T.grossProfit / T.revenue : 0; T.avgBasket = T.count ? T.revenue / T.count : 0;
    const rev = (st) => { const l = inR.filter((s) => s.status === st); return { count: l.length, total: l.reduce((n, s) => n + s.total, 0) }; };
    return { totals: T, periods: [...per.values()].sort((a, b) => a.key.localeCompare(b.key)).map((p) => Object.assign(p, { grossProfit: p.revenue - p.cogs })),
      payments: [...pay.values()].sort((a, b) => b.revenue - a.revenue), top: [...prod.values()].sort((a, b) => b.units - a.units || b.revenue - a.revenue).map((b) => Object.assign(b, { grossProfit: b.revenue - b.cost })),
      voided: rev('voided'), refunded: rev('refunded') };
  }

  function onlineSummary(orders, r) {
    const from = r.from ? new Date(r.from + 'T00:00:00').getTime() : -Infinity, to = r.to ? new Date(r.to + 'T23:59:59.999').getTime() : Infinity;
    const l = orders.filter((o) => { const t = new Date(o.createdAt).getTime(); return t >= from && t <= to; });
    return { count: l.length, total: l.reduce((n, o) => n + (o.total || 0), 0), cancelled: l.filter((o) => /cancel/i.test(o.status)).length };
  }

  POS.reports = { range, salesReport, onlineSummary, dayKey };
})();

<script>
/* ALKA MART POS - optional Google Sheets sync through a Google Apps Script web app.
   - The POS never needs it: checkout always works offline and writes locally first.
   - Records carry syncStatus = pending | synced; anything pending is (re)sent, so the offline "queue" is the database itself.
   - Sales are de-duplicated by uid; stock movements by id (delta based, idempotent). Divergence is flagged as a conflict, never overwritten silently.
   - No Google credential lives in this code. The user pastes the web-app URL and a shared token in Settings (stored locally on this device). */
(function () {
  'use strict';
  const POS = window.POS, db = POS.db;
  const state = { running: false, lastOkAt: null, lastError: '', failures: 0, nextAttemptAt: 0, timer: null, conflicts: [], log: [], listeners: [] };
  const emit = () => state.listeners.forEach((f) => { try { f(); } catch (_) { /* ignore */ } });
  const cfg = () => POS.settings.sync || {};
  const URL_OK = /^https:\/\/script\.(google|googleusercontent)\.com\//;
  const configured = () => URL_OK.test(String(cfg().url || '').trim());

  async function loadState() {
    const s = await db.metaGet('syncState', {});
    state.lastOkAt = s.lastOkAt || null; state.lastError = s.lastError || ''; state.failures = s.failures || 0; state.nextAttemptAt = s.nextAttemptAt || 0;
    state.conflicts = await db.metaGet('syncConflicts', []); state.log = await db.metaGet('syncLog', []);
  }
  const saveState = () => db.metaSet('syncState', { lastOkAt: state.lastOkAt, lastError: state.lastError, failures: state.failures, nextAttemptAt: state.nextAttemptAt });
  async function log(level, msg) {
    state.log.unshift({ at: POS.nowIso(), level, msg }); state.log = state.log.slice(0, 100);
    await db.metaSet('syncLog', state.log);
  }

  async function pending() {
    const [sales, moves, prods, orders] = await Promise.all([db.getAll('sales'), db.getAll('movements'), db.getAll('products'), db.getAll('onlineOrders')]);
    return { sales: sales.filter((s) => s.syncStatus !== 'synced'), movements: moves.filter((m) => m.syncStatus !== 'synced'),
      products: prods.filter((p) => (p.rev || 1) > (p.syncedRev || 0)), orders: orders.filter((o) => o.syncStatus !== 'synced') };
  }
  async function counts() { const p = await pending(); return { sales: p.sales.length, movements: p.movements.length, products: p.products.length, orders: p.orders.length, total: p.sales.length + p.movements.length + p.products.length + p.orders.length }; }

  async function post(body) {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 25000);
    try {
      const r = await fetch(cfg().url.trim(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: cfg().token, deviceId: POS.deviceId, sentAt: POS.nowIso() }, body)), redirect: 'follow', signal: c.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      let j; try { j = await r.json(); } catch (_) { throw new Error('The server did not return JSON. Check the web app URL and that it is deployed for "Anyone".'); }
      return j;
    } finally { clearTimeout(t); }
  }

  /* A manual "Sync now" while an automatic sync is running simply joins that run and reports its result. */
  function syncNow(manual) {
    if (state.promise) return state.promise;
    state.promise = doSync(manual).finally(() => { state.promise = null; });
    return state.promise;
  }
  async function doSync(manual) {
    if (!configured()) return { ok: false, reason: 'not_configured' };
    if (state.running) return { ok: false, reason: 'busy' };
    if (!navigator.onLine) { emit(); return { ok: false, reason: 'offline' }; }
    if (!manual && Date.now() < state.nextAttemptAt) return { ok: false, reason: 'backoff' };
    state.running = true; emit();
    const stats = { sales: 0, movements: 0, products: 0, orders: 0, errors: 0 }, sheetStock = {};
    try {
      for (let round = 0; round < 60; round++) {
        const p = await pending();
        if (!p.sales.length && !p.movements.length && !p.products.length && !p.orders.length) break;
        const progressBefore = stats.sales + stats.movements + stats.products + stats.orders;
        const sales = p.sales.slice(0, 40), movements = p.movements.slice(0, 400), orders = p.orders.slice(0, 40);
        const delta = {}; p.movements.forEach((m) => { delta[m.productId] = (delta[m.productId] || 0) + m.qtyChange; });
        const products = p.products.slice(0, 200).map((x) => Object.assign({}, x, { stockBase: POS.stockOf(x) - (delta[x.id] || 0), baseRev: x.syncedRev || 0 }));
        const res = await post({ action: 'push', sales, movements, products, onlineOrders: orders });
        if (!res || !res.ok) throw new Error((res && res.error) || 'The server rejected the request.');
        const conflicts = [];
        await db.run(['sales', 'movements', 'products', 'onlineOrders'], 'readwrite', async (S) => {
          for (const s of sales) {
            const r = (res.sales || {})[s.uid], cur = await S.sales.get(s.id); if (!cur) continue;
            if (r === 'ok' || r === 'duplicate' || r === 'updated') { if (((cur.reversal || {}).at || '') === ((s.reversal || {}).at || '')) { cur.syncStatus = 'synced'; cur.syncError = ''; stats.sales++; } }
            else { cur.syncTries = (cur.syncTries || 0) + 1; cur.syncError = String(r || 'no result'); stats.errors++; }
            await S.sales.put(cur);
          }
          for (const m of movements) { const r = (res.movements || {})[m.id]; if (r === 'ok' || r === 'duplicate') { const cur = await S.movements.get(m.id); if (cur) { cur.syncStatus = 'synced'; await S.movements.put(cur); stats.movements++; } } else stats.errors++; }
          for (const x of products) {
            const r = (res.products || {})[x.id]; const cur = await S.products.get(x.id); if (!cur) continue;
            if (r && (r.status === 'ok' || r.status === 'created')) { cur.syncedRev = x.rev; await S.products.put(cur); stats.products++; }
            else if (r && r.status === 'conflict') { cur.syncedRev = x.rev; await S.products.put(cur); conflicts.push({ id: x.id, name: x.name, kind: 'product_changed', detail: r.message || 'The sheet row was changed by someone else.', at: POS.nowIso() }); }
            else stats.errors++;
          }
          for (const o of orders) { const r = (res.onlineOrders || {})[o.number]; if (r === 'ok' || r === 'duplicate') { const cur = await S.onlineOrders.get(o.number); if (cur) { cur.syncStatus = 'synced'; await S.onlineOrders.put(cur); stats.orders++; } } }
        });
        Object.assign(sheetStock, res.stock || {});
        if (conflicts.length) { state.conflicts = conflicts.concat(state.conflicts).slice(0, 200); await db.metaSet('syncConflicts', state.conflicts); }
        if (res.errors && res.errors.length) await log('warn', res.errors.slice(0, 3).join(' | '));
        if (stats.sales + stats.movements + stats.products + stats.orders === progressBefore) break; /* no progress: stop, retry later with backoff */
      }
      /* stock divergence check: only for products with nothing left to send */
      const left = await pending(), busy = new Set(left.movements.map((m) => m.productId)), prods = await db.getAll('products');
      const mism = [];
      for (const p of prods) if (sheetStock[p.id] != null && !busy.has(p.id) && Number(sheetStock[p.id]) !== POS.stockOf(p) && !state.conflicts.some((c) => c.id === p.id && c.kind === 'stock_mismatch' && c.local === POS.stockOf(p) && c.sheet === Number(sheetStock[p.id])))
        mism.push({ id: p.id, name: p.name, kind: 'stock_mismatch', local: POS.stockOf(p), sheet: Number(sheetStock[p.id]), detail: 'POS stock ' + POS.stockOf(p) + ' but sheet stock ' + sheetStock[p.id] + '. Neither side was changed.', at: POS.nowIso() });
      if (mism.length) { state.conflicts = mism.concat(state.conflicts).slice(0, 200); await db.metaSet('syncConflicts', state.conflicts); await log('warn', mism.length + ' stock conflict(s) detected.'); }
      state.lastOkAt = POS.nowIso(); state.lastError = ''; state.failures = 0; state.nextAttemptAt = 0;
      await log('ok', 'Synced ' + stats.sales + ' sale(s), ' + stats.movements + ' movement(s), ' + stats.products + ' product(s), ' + stats.orders + ' online order(s)' + (stats.errors ? ', ' + stats.errors + ' item error(s)' : '') + '.');
      await saveState();
      return { ok: true, stats };
    } catch (e) {
      state.failures++; state.lastError = e.name === 'AbortError' ? 'Timed out waiting for Google.' : e.message || String(e);
      state.nextAttemptAt = Date.now() + Math.min(900, 15 * Math.pow(2, state.failures - 1)) * 1000;
      await log('error', state.lastError + ' (attempt ' + state.failures + '; will retry automatically)'); await saveState();
      return { ok: false, reason: 'error', error: state.lastError };
    } finally { state.running = false; emit(); }
  }

  async function test() {
    if (!configured()) throw new Error('Enter a valid Apps Script web app URL (https://script.google.com/...).');
    return post({ action: 'ping' });
  }

  /* Conflict resolution: "keep POS" overwrites the sheet row (incl. stock) with the POS values, "dismiss" just clears the flag. */
  async function resolve(c, how) {
    if (how === 'force') {
      const p = await db.get('products', c.id); if (!p) throw new Error('Product not found.');
      const res = await post({ action: 'push', force: true, products: [Object.assign({}, p, { stockBase: POS.stockOf(p), baseRev: p.rev, force: true })], sales: [], movements: [], onlineOrders: [] });
      if (!res.ok) throw new Error(res.error || 'Rejected'); await log('ok', 'Overwrote sheet row for ' + c.id + ' with POS values.');
    }
    state.conflicts = state.conflicts.filter((x) => x !== c && !(x.id === c.id && x.kind === c.kind && x.at === c.at));
    await db.metaSet('syncConflicts', state.conflicts); emit();
  }

  function start() {
    if (state.timer) return;
    state.timer = setInterval(async () => { if (configured() && cfg().auto && navigator.onLine && !state.running && (await counts()).total) syncNow(false); }, 20000);
    window.addEventListener('online', () => { emit(); if (configured() && cfg().auto) syncNow(false); });
    window.addEventListener('offline', emit);
  }

  async function info() {
    const c = await counts();
    let status = 'not_configured';
    if (configured()) status = state.running ? 'syncing' : !navigator.onLine ? 'offline' : state.lastError ? 'error' : c.total ? 'pending' : state.lastOkAt ? 'ok' : 'pending';
    return { status, pending: c, lastOkAt: state.lastOkAt, lastError: state.lastError, nextAttemptAt: state.nextAttemptAt, conflicts: state.conflicts, log: state.log, configured: configured(), auto: !!cfg().auto };
  }

  POS.sync = { loadState, syncNow, test, resolve, start, info, configured, onChange: (f) => state.listeners.push(f) };
})();

</script>

  function banners() {
    const b = [];
    if (S.seeded) b.push('<div class="banner info"><span>' + (S.seeded.source === 'website' ? 'Loaded ' + S.seeded.count + ' products from the ALKA MART website data stored in this browser.' : 'Started with the ' + S.seeded.count + ' demo products from the ALKA MART website. Import your real catalog under Data &amp; settings.') + '</span><button class="link-btn" data-act="dismissseed">Dismiss</button></div>');
    if (S.needBackup) b.push('<div class="banner warn"><span><strong>Back up your data.</strong> ' + (S.lastBackupAt ? 'Last backup: ' + POS.fmtDate(S.lastBackupAt) + '.' : 'No backup has been made yet.') + ' Data lives only in this browser on this computer.</span><button class="btn sm outline" data-act="backup">Download backup</button></div>');
    if (S.sync && S.sync.conflicts.length) b.push('<div class="banner bad"><span><strong>' + S.sync.conflicts.length + ' sync conflict(s)</strong> need review.</span><button class="btn sm outline" data-act="goto" data-p="data">Review</button></div>');
    return b.join('');
  }

  async function render() {
    await loadProducts();
    const sales = await POS.tx.list();
    S.lastBackupAt = await POS.db.metaGet('lastBackupAt', null);
    S.needBackup = sales.length > 0 && (!S.lastBackupAt || Date.now() - new Date(S.lastBackupAt).getTime() > 7 * 864e5);
    S.sync = await POS.sync.info();
    const pg = { sale: pageSale, inventory: pageInventory, moves: pageMoves, tx: pageTx, reports: pageReports, online: pageOnline, data: pageData }[S.page];
    $('#app').innerHTML = header() + '<main class="' + (S.page === 'sale' ? 'fit' : '') + '">' + banners() + '<div id="pg"></div></main>';
    await pg();
  }

  /* ================= CASHIER SCREEN ================= */
  const unitOf = (p) => POS.pricing.unit(p);
  function cartLines() { return S.cart.map((l) => { const p = S.pm.get(l.id); if (!p) return null; const u = unitOf(p), reg = POS.pricing.retail(p); return { p, q: l.qty, u, reg, s: (u || 0) * l.qty }; }).filter(Boolean); }
  function totals() {
    const L = cartLines(), sub = L.reduce((n, l) => n + l.s, 0); let disc = 0, err = '';
    try { disc = POS.tx.computeDiscount(sub, { type: S.discType, value: S.discType === 'percent' ? parseFloat(String(S.discVal).replace(',', '.')) || 0 : intOf(S.discVal) }); } catch (e) { err = e.message; }
    return { L, sub, disc, err, total: sub - disc };
  }
  function setScanMsg(text, kind) { const m = $('#scanmsg'); if (m) { m.textContent = text || ''; m.className = 'scanmsg ' + (kind || ''); } if (kind) beep(kind === 'ok'); }

  function pageSale() {
    $('#pg').innerHTML = '<div class="sale"><section class="panel lcol"><div class="scanrow"><input id="scan" type="search" autocomplete="off" spellcheck="false" aria-label="Scan barcode or search" placeholder="Scan barcode, or search name / brand / SKU   (F2)" value="' + esc(S.q) + '"><button class="btn outline" data-act="scanclear">Clear</button></div>' +
      '<p id="scanmsg" class="scanmsg" role="status" aria-live="polite"></p><div class="cats" id="cats"></div><div class="grid" id="grid"></div></section>' +
      '<aside class="panel rcol"><h2>Current sale <button class="link-btn" data-act="clearcart">Clear <kbd>F8</kbd></button></h2><div class="cart" id="cartlines"></div>' +
      '<div class="checkout"><div class="srow"><span>Subtotal</span><strong id="t-sub"></strong></div>' +
      '<div class="srow"><span>Discount</span><span class="discount"><select id="disctype" aria-label="Discount type"><option value="amount">Rp</option><option value="percent">%</option></select><input id="discval" inputmode="numeric" aria-label="Discount" placeholder="0" style="width:96px;text-align:right"></span></div>' +
      '<div class="err small" id="discerr"></div><div class="srow total"><span>Total</span><strong id="t-total"></strong></div><div class="pays" id="pays"></div>' +
      '<div class="cashbox" id="cashbox"><div class="srow"><span>Cash received</span><input id="recv" inputmode="numeric" aria-label="Cash received" placeholder="0"></div><div class="quick" id="quick"></div><div class="srow"><span>Change</span><span class="change" id="change">Rp0</span></div></div>' +
      '<div id="refbox" class="hidden" style="margin:6px 0"><input id="payref" style="width:100%" placeholder="Reference / approval code (optional)" aria-label="Payment reference"></div>' +
      '<div class="err small" id="chargeerr" role="alert"></div><button class="btn primary lg full" id="chargebtn" data-act="charge">Charge <kbd>F4</kbd></button></div></aside></div>';
    $('#disctype').value = S.discType; $('#discval').value = S.discType === 'percent' ? S.discVal : fmtInt(intOf(S.discVal)); $('#recv').value = S.received; $('#payref').value = S.ref;
    refreshGrid(); refreshCart(); $('#scan').focus();
  }

  function refreshGrid() {
    const cats = $('#cats'), grid = $('#grid'); if (!grid) return;
    cats.innerHTML = '<button class="' + (!S.cat ? 'on' : '') + '" data-act="cat" data-c="">All</button>' + POS.CATS.map((c) => '<button class="' + (S.cat === c[0] ? 'on' : '') + '" data-act="cat" data-c="' + esc(c[0]) + '">' + c[1] + ' ' + esc(c[0]) + '</button>').join('');
    const list = POS.products.search(S.products, S.q, S.cat);
    grid.innerHTML = list.length ? list.map((p) => {
      const q = POS.stockOf(p), u = unitOf(p), reg = POS.pricing.retail(p), off = q < 1 || u === null;
      return '<button class="pcard" data-act="add" data-id="' + esc(p.id) + '" ' + (off ? 'disabled' : '') + '><div class="pimg">' + (p.image ? '<img src="' + esc(p.image) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '<span>' + POS.catIcon(p.category) + '</span>' + (u !== null && u < reg ? '<span class="promo-tag">PROMO</span>' : '') + '</div>' +
        '<div class="pbody"><span class="brand">' + esc(p.brand) + '</span><span class="pname">' + esc(p.name) + '</span><span class="psize">' + esc(p.size) + '</span>' +
        (u === null ? '<span class="price">No price</span>' : '<span class="price">' + rp(u) + (u < reg ? '<s class="was">' + rp(reg) + '</s>' : '') + '</span>') +
        '<span class="stock ' + (q < 1 ? 'out' : POS.isLow(p) ? 'low' : 'ok') + '">' + (q < 1 ? 'Out of stock' : q + ' in stock' + (POS.isLow(p) ? ' · low' : '')) + '</span>' + ((p.barcode || p.sku) ? '<span class="code">' + esc(p.barcode || p.sku) + '</span>' : '') + '</div></button>';
    }).join('') : '<div class="empty" style="grid-column:1/-1">No products match “' + esc(S.q) + '”.</div>';
  }

  function refreshCart() {
    const el = $('#cartlines'); if (!el) return;
    /* keep the typed fields in step with state (e.g. cleared after a sale), without disturbing the field being typed in */
    [['#disctype', S.discType], ['#discval', S.discVal], ['#recv', S.received], ['#payref', S.ref]].forEach(([sel, v]) => { const f = $(sel); if (f && document.activeElement !== f && f.value !== v) f.value = v; });
    const T = totals();
    el.innerHTML = T.L.length ? T.L.map((l) => '<div class="line"><div><div class="n">' + esc(l.p.name) + '</div><div class="s">' + esc(l.p.brand) + ' · ' + esc(l.p.size) + ' · ' + rp(l.u) + (l.u < l.reg ? ' <span class="tag ok">promo</span>' : '') + '</div>' +

  function addToCart(id, n) {
    const p = S.pm.get(id); n = n || 1;
    if (!p) { setScanMsg('Product not found.', 'err'); return false; }
    if (POS.stockOf(p) < 1) { setScanMsg(p.name + ' ' + p.size + ' is out of stock.', 'err'); return false; }
    if (unitOf(p) === null) { setScanMsg(p.name + ' has no valid price. Fix its supplier cost in Inventory.', 'err'); return false; }
    const c = S.cart.find((l) => l.id === id), q = (c ? c.qty : 0) + n;
    if (q > POS.stockOf(p)) { setScanMsg('Only ' + POS.stockOf(p) + ' of ' + p.name + ' ' + p.size + ' in stock.', 'err'); return false; }
    if (c) c.qty = q; else S.cart.push({ id, qty: n });
    setScanMsg('Added ' + p.name + ' ' + p.size, 'ok'); refreshCart(); return true;
  }
  function setQty(id, n) {
    const p = S.pm.get(id); n = Math.floor(Number(n) || 0);
    if (n > POS.stockOf(p)) { n = POS.stockOf(p); setScanMsg('Only ' + n + ' in stock.', 'err'); }
    S.cart = n < 1 ? S.cart.filter((l) => l.id !== id) : S.cart.map((l) => (l.id === id ? { id, qty: n } : l)); refreshCart();
  }
  function handleScan() {
    const el = $('#scan'), code = el.value.trim(); if (!code) return;
    let p = POS.products.findByCode(S.products, code);
    if (!p) { const r = POS.products.search(S.products, code, S.cat); if (r.length === 1) p = r[0]; }
    if (p) { if (addToCart(p.id)) { el.value = ''; S.q = ''; refreshGrid(); } el.select(); return; }
    if (/^\d{6,}$/.test(code)) setScanMsg('Unknown barcode ' + code + '. No product in the POS has this barcode. Add it to the product in Inventory.', 'err');
    else setScanMsg('No single exact match for “' + code + '”. Tap a product below.', 'err');
    el.select();
  }

      const r = await POS.tx.checkout({ idemKey: S.idem, cashier: POS.settings.cashier, cart: S.cart.map((l) => ({ productId: l.id, qty: l.qty })),

    charge: () => charge(), printsale: (t) => viewReceipt(t.dataset.id, true, !!t.dataset.re), viewrc: (t) => viewReceipt(t.dataset.id),
    newprod: () => prodForm(null, true), editprod: (t) => prodForm(S.pm.get(t.dataset.id), false), saveprod: (t) => saveProd(t.dataset.new === '1'), stock: (t) => stockForm(S.pm.get(t.dataset.id)), savestock: () => saveStock(),
    csvexp: async (t) => { const n = await POS.csv.exportCsv(t.dataset.k); toast('Exported ' + n + ' rows'); }, txopen: (t) => txDetail(t.dataset.id), revform: (t) => revForm(t.dataset.id), dorev: () => doRev(),
    tpl: () => POS.download('alka-product-import-template.csv', POS.csv.serialize(POS.csv.PRODUCT_HEADERS, [{ id: '', name: 'Example product', brand: 'Brand', category: POS.CATS[0][0], size: '1 kg', supplier: 'Lotte Grosir', supplierPrice: 10000, priceType: 'estimated', markupPercent: '', stockQuantity: 10, minStock: 5, barcode: '', sku: '', storage: 'ambient', visible: 'true' }]), 'text/csv;charset=utf-8'),
    savesettings: async () => {
      const g = (i) => $('#' + i).value.trim(), mk = Number(g('s_markup').replace(',', '.')), low = Number(g('s_low'));
      if (!(mk >= 5 && mk <= 10)) return void ($('#s_err').textContent = 'Default markup must be between 5% and 10% (same as the website).');
      if (!Number.isInteger(low) || low < 0) return void ($('#s_err').textContent = 'Low-stock threshold must be a whole number, 0 or more.');
      await POS.saveSettings({ storeName: g('s_name') || 'ALKA MART', cashier: g('s_cashier') || 'Cashier 1', storeTagline: g('s_tag'), address: g('s_addr'), phone: g('s_phone'), receiptFooter: g('s_footer'), paperWidth: $('#s_paper').value, defaultMarkup: mk, lowStockDefault: low, csvDelimiter: $('#s_delim').value, receiptLogo: $('#s_logo').checked, autoPrint: $('#s_auto').checked });
      await POS.db.put('audit', POS.audit('settings', 'Settings saved')); toast('Settings saved'); render();
    },
    savesync: async () => { const u = $('#y_url').value.trim(); if (u && !/^https:\/\/script\.(google|googleusercontent)\.com\//.test(u)) return void ($('#y_err').textContent = 'The URL must start with https://script.google.com/'); await POS.saveSettings({ sync: { url: u, token: $('#y_token').value, auto: $('#y_auto').checked } }); toast('Sync settings saved'); render(); },
    testsync: async () => { try { await ACT.savesync(); const r = await POS.sync.test(); toast(r && r.ok ? 'Connected to Google Sheets' : 'Server said: ' + ((r && r.error) || 'no')); } catch (e) { toast('Test failed: ' + e.message); } },
    syncnow: async () => { const r = await POS.sync.syncNow(true); toast(r.ok ? 'Sync complete' : r.reason === 'not_configured' ? 'Sync is not connected' : r.reason === 'offline' ? 'You are offline. Records stay queued.' : 'Sync failed: ' + (r.error || r.reason)); render(); },
    resolve: async (t) => { try { await POS.sync.resolve(S.sync.conflicts[Number(t.dataset.i)], t.dataset.how); toast('Done'); } catch (e) { toast(e.message); } render(); },
    impapply: async () => { S.imp.entries.forEach((e, i) => { const c = $('[data-imp="' + i + '"]'); if (c) e.selected = c.checked; }); const sum = await POS.csv.apply(S.imp.entries, { applyStock: $('#imp_stock').checked }); closeModal(); await render();
      openModal('<h2>Import finished</h2><p>' + sum.created + ' created · ' + sum.updated + ' updated · ' + sum.stockAdjusted + ' stock adjustments · ' + sum.skipped + ' skipped</p>' + sum.errors.map((x) => '<div class="err small">' + esc(x) + '</div>').join('') + '<button class="btn primary" data-act="close" style="margin-top:10px">OK</button>'); },
    wbread: async () => { const w = POS.website.read(); if (!w || !w.products) return void toast('Website data is not readable from here (different site or browser). Use “Paste products JSON”.'); startImport(w.products.map(POS.csv.websiteToRow).map((r, i) => Object.assign(r, { _line: i + 1 })), 'website storage'); },
    wbpaste: () => openModal('<h2>Paste website products</h2><p class="small muted">On the website, open the browser console (F12) and run <code>copy(localStorage.getItem("alka.products.v1"))</code>, then paste here.</p><textarea id="wjson" rows="8" style="width:100%"></textarea><div class="err" id="wj_err"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" data-act="wbparse">Preview</button><button class="btn outline" data-act="close">Cancel</button></div>'),
    wbparse: () => { try { const a = JSON.parse($('#wjson').value); if (!Array.isArray(a)) throw 0; closeModal(); startImport(a.map(POS.csv.websiteToRow).map((r, i) => Object.assign(r, { _line: i + 1 })), 'pasted JSON'); } catch (_) { $('#wj_err').textContent = 'That is not a valid products JSON array.'; } },
    ordread: async () => { const w = POS.website.read(); if (!w || !w.orders.length) return void toast('No online orders readable from here. Use “Paste orders JSON”.'); const r = await importOrders(w.orders); toast(r.added + ' imported, ' + r.skipped + ' already present'); render(); },
    ordpaste: () => openModal('<h2>Paste online orders</h2><p class="small muted">On the website console run <code>copy(localStorage.getItem("alka.orders.v1"))</code> and paste here.</p><textarea id="ojson" rows="8" style="width:100%"></textarea><div class="err" id="oj_err"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" data-act="ordparse">Import</button><button class="btn outline" data-act="close">Cancel</button></div>'),
    ordparse: async () => { try { const r = await importOrders(JSON.parse($('#ojson').value)); closeModal(); toast(r.added + ' imported, ' + r.skipped + ' skipped'); render(); } catch (e) { $('#oj_err').textContent = e.message || 'Invalid JSON.'; } },
    dorestore: async () => { if ($('#rs_conf').value.trim() !== 'RESTORE') return void ($('#rs_err').textContent = 'Type RESTORE to confirm.'); const tok = POS.settings.sync.token; await POS.db.importAll(S.restore.data); await POS.loadSettings(); if (!POS.settings.sync.token) await POS.saveSettings({ sync: Object.assign({}, POS.settings.sync, { token: tok }) }); await POS.sync.loadState(); closeModal(); S.restore = null; toast('Backup restored'); render(); },
    resetall: () => openModal('<h2>Erase all POS data?</h2><p>This deletes every product, sale, stock record and setting in this browser. It cannot be undone. Download a backup first.</p><label class="field">Type ERASE to confirm<input id="er_conf"></label><div class="err" id="er_err"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn danger" data-act="doreset">Erase everything</button><button class="btn outline" data-act="close">Cancel</button></div>'),
    doreset: async () => { if ($('#er_conf').value.trim() !== 'ERASE') return void ($('#er_err').textContent = 'Type ERASE to confirm.'); await POS.db.clearAll(); await POS.loadSettings(); S.cart = []; S.seeded = await POS.seedIfEmpty(); await POS.sync.loadState(); closeModal(); toast('All POS data erased'); render(); }
  };
  document.addEventListener('click', (e) => { const t = e.target.closest('[data-act]'); if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e); });

  document.addEventListener('input', (e) => {
    const t = e.target, id = t.id;
    if (id === 'scan') { S.q = t.value; refreshGrid(); }
    else if (id === 'discval') { S.discVal = S.discType === 'percent' ? t.value : fmtInt(intOf(t.value)); if (S.discType !== 'percent') t.value = S.discVal; refreshCart(); }
    else if (id === 'recv') { S.received = fmtInt(intOf(t.value)); t.value = S.received; refreshCart(); }
    else if (id === 'payref') S.ref = t.value;
    else if (id === 'iq') { S.inv.q = t.value; pageInventory().then(() => refocus('iq')); }
    else if (id === 'mq') { S.mv.q = t.value; pageMoves().then(() => refocus('mq')); }
    else if (id === 'tq') { S.tx.q = t.value; pageTx().then(() => refocus('tq')); }
    else if (id === 'pf_supplierPrice' || id === 'pf_markupPercent') prodPrev();
    else if (id === 'sf_qty') stockPrev();
  });
  document.addEventListener('change', async (e) => {
    const t = e.target, id = t.id;
    if (t.dataset.qin) { const qid = t.dataset.qin, qv = t.value; setTimeout(() => setQty(qid, qv), 0); } /* deferred: never replace the DOM inside a blur/change dispatch */
    else if (id === 'disctype') { S.discType = t.value; S.discVal = ''; $('#discval').value = ''; refreshCart(); }
    else if (id === 'ic') { S.inv.cat = t.value; pageInventory(); } else if (id === 'if') { S.inv.f = t.value; pageInventory(); }
    else if (id === 'mt') { S.mv.type = t.value; pageMoves(); } else if (id === 'mf') { S.mv.from = t.value; pageMoves(); } else if (id === 'mto') { S.mv.to = t.value; pageMoves(); }
    else if (id === 'ts') { S.tx.status = t.value; pageTx(); } else if (id === 'tm') { S.tx.method = t.value; pageTx(); } else if (id === 'tf') { S.tx.from = t.value; pageTx(); } else if (id === 'tto') { S.tx.to = t.value; pageTx(); }
    else if (id === 'rk') { S.rep.kind = t.value; S.rep.group = t.value === 'year' ? 'month' : 'day'; if (t.value === 'custom' && !S.rep.from) S.rep.from = S.rep.to = POS.reports.dayKey(POS.nowIso()); pageReports(); }
    else if (id === 'rf') { S.rep.from = t.value; pageReports(); } else if (id === 'rt') { S.rep.to = t.value; pageReports(); } else if (id === 'rgp') { S.rep.group = t.value; pageReports(); }
    else if (id === 'sf_type') stockPrev();
    else if (id === 'imp_stock') S.imp.applyStock = t.checked;
    else if (id === 'csvfile' && t.files[0]) {
      try { const tbl = POS.csv.parse(await readFile(t.files[0])), o = POS.csv.rowsToObjects(tbl); if (!o.head.includes('name') && !o.head.includes('id')) throw new Error('No "name" or "id" column found. Download the template to see the expected columns.'); t.value = ''; await startImport(o.objs, 'the CSV'); if (o.unknown.length) toast('Ignored unknown columns: ' + o.unknown.join(', ')); } catch (x) { toast(x.message); }
    } else if (id === 'bkfile' && t.files[0]) {
      try { const j = JSON.parse(await readFile(t.files[0])); if (j.app !== 'alka-mart-pos' || !j.data || !Array.isArray(j.data.products)) throw new Error('This is not an ALKA MART POS backup file.'); S.restore = j; t.value = '';
        openModal('<h2>Restore backup?</h2><p>Backup from <strong>' + POS.fmtDate(j.exportedAt) + '</strong>: ' + Object.entries(j.counts || {}).map(([k, v]) => v + ' ' + k).join(', ') + '.</p><p class="err">This replaces ALL current POS data (products, sales, stock history, settings) in this browser.</p><label class="field">Type RESTORE to confirm<input id="rs_conf"></label><div class="err" id="rs_err"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn danger" data-act="dorestore">Replace my data</button><button class="btn outline" data-act="close">Cancel</button></div>'); } catch (x) { toast(x.message || 'Could not read that file.'); }
    }
  });
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (e.key === 'Escape' && modalOpen()) { closeModal(); return; }
    if (e.key === 'Enter' && modalOpen() && t.id === 'newsale') return;
    if (e.key === 'Enter' && t.id === 'scan') { e.preventDefault(); handleScan(); return; }
    if (e.key === 'Enter' && t.id === 'recv') { e.preventDefault(); charge(); return; }
    if (e.key === 'Enter' && t.dataset && t.dataset.qin) { e.preventDefault(); $('#scan').focus(); return; } /* leaving the field commits the quantity via its change event */
    if (S.page === 'sale' && !modalOpen()) {
      if (e.key === 'F2') { e.preventDefault(); $('#scan').focus(); $('#scan').select(); }
      else if (e.key === 'F4') { e.preventDefault(); if (S.method === 'cash' && !intOf(S.received) && S.cart.length) { $('#recv').focus(); } else charge(); }
      else if (e.key === 'F8') { e.preventDefault(); ACT.clearcart(); }
      else if (document.activeElement === document.body && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) $('#scan').focus(); /* barcode scanner typed while focus was elsewhere */
    }
  });
  window.addEventListener('offline', () => refreshSync()); window.addEventListener('online', () => refreshSync());

  /* ================= START ================= */
  (async function init() {
    try {
      await POS.db.open(); await POS.loadSettings(); S.seeded = await POS.seedIfEmpty(); await POS.sync.loadState(); POS.sync.onChange(() => refreshSync()); POS.sync.start();
      try { S.persisted = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : null; } catch (_) { S.persisted = null; }
      await render();
    } catch (e) { $('#app').innerHTML = '<div class="panel" style="margin:24px"><h2>ALKA MART POS could not start</h2><p class="err">' + esc(e.message || e) + '</p><p>IndexedDB must be available (not a private/incognito window with storage blocked).</p></div>'; }
  })();
})();

</script>
</body>
</html>
